# main에 push하면 스모크 테스트를 통과한 경우에만 gh-pages 브랜치로 사이트 파일을 배포한다.
# GitHub Pages 소스는 기존 그대로 gh-pages 브랜치 — 저장소 설정 변경 불필요.
name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 연속 push 시 배포가 겹치지 않도록 순서대로 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # 로그는 로그인해야 보이므로, 실패한 테스트는 공개로 보이는 주석(annotation)과 요약에 남긴다
      - name: Report test failures
        if: failure()
        run: |
          {
            echo '## Smoke test output (tail)'
            echo '```'
            tail -n 150 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 오류 줄 뒤 4줄(기댓값·실제값)까지 함께 남긴다
          grep -E -A4 '^\s*(✖|AssertionError|TimeoutError|Error)' test-output.txt | grep -v '^--$' | awk 'NF && !seen[$0]++' | head -n 30 |
            sed -e 's/%/%25/g' -e 's/^\s*//' |
            while IFS= read -r line; do echo "::error title=Smoke test::${line}"; done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages 브랜치 push
    steps:
      - uses: actions/checkout@v5

      - name: Check out gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: _site

      # 개발 전용 파일을 제외한 저장소 전체를 gh-pages 작업 트리에 동기화 (삭제된 파일도 반영)
      # 패턴은 '/'로 저장소 루트에 고정 — 하위 폴더의 같은 이름 파일은 배포에 포함된다
      - name: Sync site files
        run: |
          rsync -a --delete \
            --exclude '/.git' \
            --exclude '/_site' \
            --exclude '/.github' \
            --exclude '/.gitignore' \
            --exclude '/node_modules' \
            --exclude '/tests' \
            --exclude '/scripts' \
            --exclude '/package.json' \
            --exclude '/package-lock.json' \
            ./ _site/

      - name: Commit & push
        working-directory: _site
        env:
          # 커밋 메시지는 스크립트에 직접 보간하지 않고 환경변수로 전달 (셸 인젝션 방지)
          SOURCE_MESSAGE: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "사이트 파일 변경 없음 — 배포 생략"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "deploy: main ${GITHUB_SHA::7} 자동 배포" -m "$SOURCE_MESSAGE"
          git push origin gh-pages
